name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        paseo-sdk: [0.12.0, 0.13.0, 0.14.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.paseo-sdk != '0.12.0'
        run: npm install --ignore-scripts --no-save --package-lock=false @getpaseo/client@${{ matrix.paseo-sdk }} @getpaseo/plugin@${{ matrix.paseo-sdk }} @getpaseo/protocol@${{ matrix.paseo-sdk }}
      - run: npm run check
  simulation:
    strategy:
      fail-fast: false
      matrix:
        paseo: [0.12.0, 0.13.0, 0.14.0]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/simulation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tests/simulation --ignore-scripts --no-audit --no-fund
      - run: node --no-maglev tests/simulation/run.mjs --paseo ${{ matrix.paseo }} --expect-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-${{ matrix.platform }}-paseo-${{ matrix.paseo }}
          path: test-results/
          if-no-files-found: error
